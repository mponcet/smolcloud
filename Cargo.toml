[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["time", "json"] }

axum = { version = "0.8", default-features = false }
tower-service = "0.3.3"
serde = { version = "1.0" }
argon2 = { version = "0.5" }
uuid = { version = "1.23" }
secrecy = { version = "0.10" }
worker = { version = "0.7" }
worker-sys = { version = "0.7" }
worker-macros = { version = "0.7", features = ["http"] }

reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = [ "rt-multi-thread", "macros" ] }
