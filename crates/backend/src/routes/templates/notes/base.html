<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.7"></script>
</head>
<body>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-4">
            <div class="d-flex flex-column gap-2 mb-4">
                <a href="#" class="btn btn-sm btn-primary" hx-get="/notes/new" hx-target="#notes-content" hx-swap="innerHTML">
                    <i class="bi bi-plus-lg"></i> New Note
                </a>
                <button class="btn btn-sm btn-outline-secondary" hx-get="/notes" hx-target="#notes-cards" hx-swap="innerHTML" hx-trigger="click, load">
                <i class="bi bi-arrow-clockwise"></i> Reload
                </button>
            </div>

            <div id="notes-cards" class="mb-4">
            </div>
        </div>
        <div class="col-md-8">
            <div id="notes-content">
                Note content
            </div>
        </div>
    </div>
</div>
</body>
