{% for note in notes %}
  <div class="mb-2">
    <div>
      <h5>
        <a href="#"
           class="note-link"
           data-note-id="{{ note.name }}"
           hx-get="/notes/{{ note.name }}/edit"
           hx-trigger="click"
           hx-target="#notes-content"
           hx-swap="innerHTML">
          {{ note.name }}
        </a>
      </h5>
    </div>
  </div>
{% endfor %}
