name = "backend-cloudflare"
main = "build/index.js"
compatibility_date = "2026-03-08"

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"
watch_dir = ["../backend", "../bindings", "../bindings-cloudflare", "../models"]

[[r2_buckets]]
binding = "bucket"
bucket_name = "bucket"

[[kv_namespaces]]
binding = "auth"
id = "7fe46f77dc604658b2fd6d2ea5b27bff"
